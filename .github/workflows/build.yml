name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip
        run: |
          unzip -o rose-android-0.5.0.zip -d rose-src
          D=$(dirname "$(find rose-src -name 'settings.gradle*' | head -n 1)")
          echo "PROJECT_DIR=$D" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rose-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
